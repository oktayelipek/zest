name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Zest.sln --nologo
      - run: dotnet build Zest.sln -c Release --nologo
